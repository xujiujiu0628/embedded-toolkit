# F-126 (工单 P1-5): lint 门禁零起步。
# 规则集从默认 E/F 起步: 正确性类 (F401/F541/F811/F841) 已清零并由 CI 守护;
# 纯风格存量债白名单如下——白名单是"登记"不是"消失", 逐条清债另立任务。
[lint]
select = ["E", "F"]
ignore = [
    "E501",  # 行宽 — 存量 491 处, 中文注释长行属既有排版风格, 不做机械折行
    "E741",  # l/I/O 歧义变量名 — 存量 19 处, 多为寄存器位域/数学语境
    "E701",  # 冒号后一行多语句 — 存量 15 处, 紧凑 guard 既有风格
    "E402",  # sys.path bootstrap 后才 import — scripts 入口族标准启动模式
]
