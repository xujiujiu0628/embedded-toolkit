# F-152 (总工单 v2 T8/D-1): 真机 CI 冒烟 — self-hosted runner 专属。
#
# 纪律: workflow_dispatch 手动触发 + HW_RUNNER_READY 仓库变量门控 —
# 仓库未配置真机 runner 时本 workflow **永不运行**, 不影响主 CI (ci.yml)。
# runner (维护者本机 Windows + ST-Link) 在场时: doctor 环境矩阵 → 按仓库
# 变量 HW_VERIFY_PROJECT 指向的真机工程跑闭环 verify (schedule origin,
# F-046 审计口径)。摘要走 F-151 evidence_export, 失败运行也出报告。
#
# sim 后端 (examples/sim-demo) 不需要本 workflow — 它在主 CI 的 sim-demo
# job 无硬件跑; 这里是"真机证据 hardware_validated"的冒烟通道。

name: HW Smoke

on:
  workflow_dispatch:

jobs:
  hw-smoke:
    if: vars.HW_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows]
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # F-214: 默认 fetch-depth=1 浅克隆拿不到仓默认分支, 导致
          # fixture 漂移金值比对在 CI 上无法执行 (长期假绿, 见
          # test_f196_tamper_semantics._base_ref 的显式 skip)。全量取
          # 以让基准分支可达, 该比对才真正跑起来。
          fetch-depth: 0
      # 自托管 runner = 维护者本机: 直接用本机 Python, 不用 setup-python。
      # 首次真跑实测 setup-python 在"经代理/镜像的 github.com"上取版本时
      # 报 unable to verify the first certificate（Node 不认本机 MITM CA），
      # 属环境性不可用; 本机工具链版本由 machine.json + doctor 负责核对。
      - name: 本机 Python 自检 (self-hosted 不走 setup-python)
        run: |
          python --version
          python -c "import sys; assert sys.version_info >= (3, 10), sys.version; print(sys.executable)"
      # machine.json 是本机文件（.gitignore 覆盖），checkout 不带它。
      # 真机 runner 上由仓库变量 HW_MACHINE_JSON 指向本机源文件注入；
      # 未设则 doctor --strict 会因占位值失败——显式点名而不是静默。
      - name: Provision machine.json (自托管本机文件, 不入库)
        run: |
          if (-not "${{ vars.HW_MACHINE_JSON }}") {
            Write-Error "仓库变量 HW_MACHINE_JSON 未设置 — 无法为 checkout 注入 machine.json"
            exit 1
          }
          Copy-Item -LiteralPath "${{ vars.HW_MACHINE_JSON }}" -Destination "$env:GITHUB_WORKSPACE\machine.json" -Force
          Write-Host "machine.json <- ${{ vars.HW_MACHINE_JSON }}"
      - name: "环境预检 (doctor --strict: toolkit/Python/machine.json/gcc/openocd/make/SWD)"
        run: python scripts/verify.py --doctor --json --strict
      # HW_VERIFY_PROJECT 未设置时只冒烟 doctor (SWD 连通性已在其中);
      # 设置后对指定真机工程跑完整闭环 (schedule origin 审计可辨)
      - name: 真机闭环 verify (HW_VERIFY_PROJECT 在场时)
        if: vars.HW_VERIFY_PROJECT != ''
        env:
          # 仓库变量不会自动进环境；旧版直读 $env: 恒为空 → verify 落回
          # checkout 根、判据错位（workflow 从未跑过，此缺陷一直潜伏）。
          HW_VERIFY_PROJECT: ${{ vars.HW_VERIFY_PROJECT }}
        run: |
          python scripts/verify.py --project "$env:HW_VERIFY_PROJECT" --json --task-origin schedule --require-schedule-origin | Tee-Object -FilePath verify-result.json
      - name: Export evidence summary (F-151)
        if: always()
        run: |
          if (Test-Path verify-result.json) {
            python scripts/evidence_export.py --verify-file verify-result.json
          } else {
            Write-Host "verify 未运行 (HW_VERIFY_PROJECT 未设置) — 仅 doctor 冒烟"
          }
